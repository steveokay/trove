name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          # Build the linter with this repository's toolchain rather than
          # downloading the release binary. The published v1.64.8 binary is
          # built with Go 1.24 and refuses any module targeting a newer
          # language version, so a go.mod bump would otherwise break linting
          # with no way to pin around it inside the v1 series.
          install-mode: goinstall
          # Schema verification fetches a JSON schema from golangci-lint.run on
          # every run, which makes linting depend on a third-party site being
          # up: it has already failed CI once on a timeout. The config is
          # exercised for real by the run below, and by every developer's
          # `make lint`, so nothing is lost by not re-validating its shape
          # against the network.
          verify: false
      - name: shellcheck
        run: shellcheck scripts/*.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify the coverage gate script
        run: bash scripts/coverage_test.sh
      - name: Test with race detector and coverage
        run: go test ./... -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out
      - name: Enforce coverage gate
        run: bash scripts/coverage.sh coverage.out 95.0
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  bench:
    name: Push latency
    runs-on: ubuntu-latest
    steps:
      # Two commits deep: the gate compares this one against its parent on the
      # same machine, which needs the parent's code.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify the benchmark gate script
        run: bash scripts/bench-check-selftest.sh
      # A baseline is only comparable to a measurement from the same hardware,
      # and ubuntu-latest is not one machine: the same benchmark measured 79ms,
      # 96ms and 134ms across three runners in one day, with an identical
      # allocation profile. So the parent commit is measured here, now, on this
      # runner, and becomes the baseline for the commit under test. A
      # regression is then a difference in the code, which is the only kind
      # worth failing a build over.
      - name: Measure the parent commit on this runner
        run: |
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git worktree add ../bench-parent HEAD~1
            (cd ../bench-parent && bash scripts/bench-check.sh /nonexistent "$GITHUB_WORKSPACE/parent-bench.txt")
          else
            echo "bench: no parent commit to compare against; the gate records instead"
          fi
      - name: Compare push latency against the parent commit
        env:
          BENCH_RAW: head-bench.txt
        run: bash scripts/bench-check.sh parent-bench.txt bench-candidate.txt
      # The committed baseline stays as long-run drift context. It was captured
      # on whatever runner CI happened to give us, so it reports rather than
      # fails -- a machine change must not read as a regression. It re-reads
      # the measurement above rather than benchmarking again: two comparisons
      # of one run say more than two runs compared to different things.
      - name: Report drift against the committed baseline
        env:
          BENCH_ADVISORY: "1"
          BENCH_INPUT: head-bench.txt
        run: bash scripts/bench-check.sh scripts/bench-baseline.txt drift-candidate.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-baseline-candidate
          path: bench-candidate.txt
          if-no-files-found: warn

  conformance:
    name: OCI conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The suite is upstream's, built from a pinned tag so a change to it is
      # a deliberate edit here rather than a surprise on a Tuesday. It is a
      # separate module, so it is built outside the workspace and never
      # reaches this repository's go.mod.
      - name: Build the distribution-spec conformance suite
        env:
          SPEC_REF: v1.1.1
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$SPEC_REF" \
            https://github.com/opencontainers/distribution-spec.git "$RUNNER_TEMP/distribution-spec"
          cd "$RUNNER_TEMP/distribution-spec/conformance"
          go test -c -o "$RUNNER_TEMP/conformance.test"
      - name: Run the suite against a real trove serve
        env:
          TROVE_CONFORMANCE_BIN: ${{ runner.temp }}/conformance.test
        run: go test -count=1 -v -timeout 20m ./test/conformance/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: |
            ${{ runner.temp }}/distribution-spec/conformance/*.html
            ${{ runner.temp }}/distribution-spec/conformance/*.xml
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/trove
