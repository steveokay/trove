name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          # Build the linter with this repository's toolchain rather than
          # downloading the release binary. The published v1.64.8 binary is
          # built with Go 1.24 and refuses any module targeting a newer
          # language version, so a go.mod bump would otherwise break linting
          # with no way to pin around it inside the v1 series.
          install-mode: goinstall
          # Schema verification fetches a JSON schema from golangci-lint.run on
          # every run, which makes linting depend on a third-party site being
          # up: it has already failed CI once on a timeout. The config is
          # exercised for real by the run below, and by every developer's
          # `make lint`, so nothing is lost by not re-validating its shape
          # against the network.
          verify: false
      - name: shellcheck
        run: shellcheck scripts/*.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify the coverage gate script
        run: bash scripts/coverage_test.sh
      - name: Test with race detector and coverage
        run: go test ./... -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out
      - name: Enforce coverage gate
        run: bash scripts/coverage.sh coverage.out 95.0
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  bench:
    name: Push latency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify the benchmark gate script
        run: bash scripts/bench-check-selftest.sh
      # Enforces when scripts/bench-baseline.txt exists; records and passes
      # when it does not, or when it has no entry for a benchmark. Baselines
      # are hardware-specific, so the first numbers come from this job rather
      # than from anyone's workstation: download the bench-baseline-candidate
      # artifact and commit its file as scripts/bench-baseline.txt.
      - name: Compare push latency against the baseline
        run: bash scripts/bench-check.sh scripts/bench-baseline.txt bench-candidate.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-baseline-candidate
          path: bench-candidate.txt
          if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o /dev/null ./cmd/trove
